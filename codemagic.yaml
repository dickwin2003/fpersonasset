workflows:
  ios-build:
    name: iOS Build (no signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate Podfile and install pods
        script: |
          flutter precache --ios
          cd ios
          flutter pub get
          pod install || true
          cd ..
      - name: Build iOS and create IPA (unsigned)
        script: |
          flutter build ios --release --no-codesign
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -r ../Runner_unsigned.ipa Payload && cd ../..
    artifacts:
      - build/Runner_unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - dickwin2003@users.noreply.github.com
        notify:
          success: true
          failure: true
